# AI services only. Infrastructure (MySQL, RabbitMQ, MongoDB Atlas Local) is owned by the
# backend repository's docker-compose.yml, which creates the shared network "hanstep-net".
# Start the backend infrastructure first, then:  docker compose up -d
# To start everything from here in one command, see compose.full.yml.
services:
  ai-server:
    build:
      context: ./ai
    image: hanstep-ai:local
    container_name: hanstep-ai-server
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${AI_PORT:-8000}:8000"
    env_file:
      - ./ai/.env
    environment:
      # Container addresses on hanstep-net override the host addresses in ai/.env.
      MONGO_URI: ${MONGO_URI:?Set the container MongoDB URI (mongodb:27017) in .env}
      RABBITMQ_URL: ${RABBITMQ_URL:?Set the container RabbitMQ URL (rabbitmq:5672) in .env}
      SPRING_INTERNAL_API_URL: ${SPRING_INTERNAL_API_URL:-http://host.docker.internal:8080}
      LOAD_MODEL_ON_STARTUP: ${LOAD_MODEL_ON_STARTUP:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # BGE-M3 weights (~2.3 GB) downloaded once and reused across rebuilds.
      - hf-cache:/models/huggingface
    networks:
      - hanstep-net

  ai-worker:
    # Not started by default: the RabbitMQ POLICY_INGEST contract is not settled yet.
    # Run explicitly with:  docker compose --profile worker up -d ai-worker
    profiles: ["worker"]
    image: hanstep-ai:local
    container_name: hanstep-ai-worker
    restart: unless-stopped
    init: true
    command: ["python", "-m", "app.worker"]
    env_file:
      - ./ai/.env
    environment:
      MONGO_URI: ${MONGO_URI:?Set the container MongoDB URI (mongodb:27017) in .env}
      RABBITMQ_URL: ${RABBITMQ_URL:?Set the container RabbitMQ URL (rabbitmq:5672) in .env}
      SPRING_INTERNAL_API_URL: ${SPRING_INTERNAL_API_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hf-cache:/models/huggingface
    networks:
      - hanstep-net

networks:
  hanstep-net:
    external: true
    name: hanstep-net

volumes:
  hf-cache:
