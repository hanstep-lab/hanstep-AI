[project]
name = "shinhan-ai-server"
version = "0.1.0"
description = "AI backend for financial and visa assistance"
requires-python = ">=3.11,<3.12"
dependencies = [
    # API server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28.1",
    # LLM / agent
    "langchain>=1.0.0",
    "langgraph>=1.0.0",
    "langchain-anthropic>=1.0.0",
    # Vector search / embeddings
    "pymongo>=4.13.0",
    "sentence-transformers>=3.4.0",
    "numpy>=1.26.0",
    # Queue / storage
    "aio-pika>=9.4.0",
    "boto3>=1.35.0",
    # Policy collection / parsing
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "defusedxml>=0.7.1",
    "pypdf>=5.0.0",
    "olefile>=0.47",
    # Utilities
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
    "tzdata>=2026.6",
    "pandas>=3.1.1",
    "anthropic>=2.4.0",
]

[dependency-groups]
lint = [
    "ruff==0.14.0",
    "mypy==1.18.2",
    "pandas-stubs>=3.1.0.261029",
]
test = [
    "hypothesis>=6.170.15",
    "pytest==9.0.0",
    "pytest-asyncio==1.3.0",
    "pytest-cov==6.0.0",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "pre-commit==4.3.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", ".uv-cache", ".pytest_cache", ".mypy_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: 외부 서비스 없이 실행하는 단위 테스트",
    "integration: DB, RabbitMQ 및 외부 서비스 통합 테스트",
    "llm: 실제 LLM API 호출이 필요한 테스트",
    "rag: 임베딩 및 벡터 검색 테스트",
]
filterwarnings = ["error::pytest.PytestUnknownMarkWarning"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "defusedxml", "defusedxml.*", "olefile", "olefile.*"]
ignore_missing_imports = true
